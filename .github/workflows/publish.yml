name: Publish mirror

# A pull request to master runs `test` and `build`, two of .github/settings.yml's required checks. build runs
# build.py --dry-run: it checks every released version against its release, so a pull request that edits a published
# build fails, and builds only the versions that have no release yet, the ones the pull request adds, creating no
# release. A push or a manual run runs the same steps as `release`, which creates the releases, then site and deploy.
# site stays off pull requests: it adds no check of its own, running the same check_recorded over the same releases,
# and it refuses a version that has no release yet, so on a pull request that adds one it could only fail.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests get a group of their own, so that a pull request's run never takes the place of a publish waiting in
# the publish group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pull-request-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check hashes against a real lock file (oracle/oci 9.9.0, linux_amd64)
        run: |
          url=$(curl -fsSL https://registry.opentofu.org/v1/providers/oracle/oci/9.9.0/download/linux/amd64 \
            | python -c 'import json, sys; print(json.load(sys.stdin)["download_url"])')
          curl -fsSL -o "$RUNNER_TEMP/oci.zip" "$url"
          python tools/mirror.py check-lock-vector "$RUNNER_TEMP/oci.zip" tests/fixtures/oci-9.9.0.lock-hashes.txt

  # A pull request's build, and the required check: build.py --dry-run reads releases and creates none, so it gets a
  # read-only token. Dependabot's runs honour `permissions`, so a write token here would reach the action updates it
  # proposes.
  build:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Each source's go.mod selects its own toolchain through GOTOOLCHAIN=auto (set by build.py).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build missing versions, and release them unless on a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        run: python tools/build.py providers.toml "$RUNNER_TEMP/dist" ${DRY_RUN:+"$DRY_RUN"}

  # build's steps, on a push or a manual run, where they create the releases.
  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create releases
    steps: *build-steps

  site:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Render mirror documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/mirror.py site providers.toml _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
