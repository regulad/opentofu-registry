# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
# Pages (workflow builds, the opentofu.regulad.xyz domain, HTTPS) is not managed by the app;
# see the README's one-time setup.
_extends: .github

repository:
  name: opentofu-registry
  description: >-
    OpenTofu provider mirror for builds not yet released upstream
  homepage: https://opentofu.regulad.xyz/
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: opentofu, terraform, provider-mirror, network-mirror, github-pages, homelab
  default_branch: master

  has_issues: false
  has_downloads: false
